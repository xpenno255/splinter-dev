server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Text assets: compress
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The scroll-world clips + posters never change once shipped — cache hard.
    # (New deploys ship new files; HTML below stays no-cache so it always
    # points at the current assets.)
    location /assets/world/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Gig dates & video picks are edited between deploys — don't cache.
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Security headers (mirrors the old staticwebapp.config.json)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
