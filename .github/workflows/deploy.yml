name: Build & deploy container

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    # Runs only after azure-setup.sh has created the Container App and set the
    # AZURE_* secrets + flipped this repo variable to 'true'.
    if: ${{ vars.AZURE_CONFIGURED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC federated login — no stored password
      contents: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name splinter-web \
              --resource-group splinter-rg \
              --image ${{ env.IMAGE_NAME }}:${{ github.sha }}
